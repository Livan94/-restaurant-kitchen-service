{% extends "base.html" %}

{% block title %}Delete ingredient | Kitchen Service{% endblock %}

{% block content %}
  <div class="table-container">
    <h1 class="mb-3">Delete ingredient</h1>
    <p class="mb-4">
      Are you sure you want to delete <strong>"{{ ingredient.name }}"</strong>?
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'kitchen:ingredient-list' %}" class="btn btn-outline-secondary">
          Cancel
        </a>
      </div>
    </form>
  </div>
{% endblock %}
