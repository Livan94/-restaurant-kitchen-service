{% if is_paginated %}
  <nav aria-label="Page navigation" class="mt-4">
    <ul class="pagination">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?page=1{% if query %}&query={{ query }}{% endif %}">
            First
          </a>
        </li>
        <li class="page-item">
          <a class="page-link"
             href="?page={{ page_obj.previous_page_number }}{% if query %}&query={{ query }}{% endif %}">
            Previous
          </a>
        </li>
      {% endif %}

      <li class="page-item active">
        <span class="page-link">
          {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
        </span>
      </li>

      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link" href="?page={{ page_obj.next_page_number }}{% if query %}&query={{ query }}{% endif %}">
            Next
          </a>
        </li>
        <li class="page-item">
          <a class="page-link"
             href="?page={{ page_obj.paginator.num_pages }}{% if query %}&query={{ query }}{% endif %}">
            Last
          </a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
